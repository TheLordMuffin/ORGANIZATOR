<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizator</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; background:#fafaf8; color:#181816;
    font-family:"IBM Plex Mono","SF Mono",Menlo,monospace;
    padding:24px 20px 80px;
  }
  .wrap{max-width:600px; margin:0 auto;}

  .line-wrap{ position:relative; background:#fafaf8; }
  .trash-bg{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
    gap:2px; padding-right:14px; color:#c9c6bd; pointer-events:none;
  }
  .trash-bg .icon{ font-size:20px; }
  .trash-bg .word{ font-size:12px; font-weight:700; letter-spacing:.55em; white-space:nowrap; padding-right:.1em; }
  .trash-bg.armed{ color:#b3423a; }

  .line{
    display:flex; align-items:baseline; gap:10px;
    font-size:21px; line-height:1.35; padding:15px 2px;
    border-bottom:2px solid #c9c6bd;
    cursor:pointer; white-space:pre-wrap; word-break:break-word;
    touch-action:none; user-select:none;
    background:#fafaf8; position:relative;
  }
  .line.blocked{ border-bottom:2px solid #b3423a; }
  .line.received{ border-bottom-style:dashed; }
  .line-text{ flex:1; min-width:0; }
  .line-assignee{ flex:none; font-size:14px; color:#2f5d50; }
  .line-from{ flex:none; font-size:14px; color:#6b4a8a; }
  .line-date{ flex:none; font-size:14px; color:#83807a; }
  .line-date.retard{ color:#b3423a; font-weight:700; }
  .line-sub{ flex:none; font-size:13px; color:#83807a; }

  .panel{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:10px 2px 14px; border-bottom:1px solid #e2e0da; font-size:14px; color:#83807a;
  }
  .panel input[type=text]{
    font:inherit; font-size:15px; border:none; border-bottom:1px solid #c9c6bd;
    background:transparent; color:#181816; outline:none; min-width:140px;
  }
  .panel input[type=date]{
    font:inherit; font-size:14px; border:none; border-bottom:1px solid #c9c6bd;
    background:transparent; color:#181816; outline:none;
  }
  .panel .toggle, .panel .chip, .panel .link{ cursor:pointer; user-select:none; }
  .panel .toggle.on{ color:#b3423a; font-weight:700; text-decoration:underline; }
  .panel .chip{ color:#2f5d50; }
  .panel .chip:hover{ text-decoration:underline; }
  .panel .sep{ color:#c9c6bd; }
  .panel .static{ color:#181816; font-size:15px; }

  .bottom-bar{ display:flex; justify-content:center; align-items:center; gap:28px; padding:22px 0; }
  .icon-btn{ font-size:22px; color:#c9c6bd; cursor:pointer; user-select:none; }
  .icon-btn:hover{ color:#83807a; }

  .back{ font-size:14px; color:#83807a; cursor:pointer; user-select:none; margin-bottom:14px; display:inline-block; }
  .back:hover{ color:#181816; text-decoration:underline; }

  .hint{ font-size:13px; color:#c9c6bd; padding:15px 2px; }
  .contact-status{ flex:none; font-size:12px; color:#c9c6bd; }
  .contact-status.accepted{ color:#2f5d50; }
  .contact-status.pending{ color:#b8752a; }

  .request-row{
    display:flex; align-items:center; gap:14px; padding:12px 2px; font-size:14px;
    border-bottom:1px solid #e2e0da; flex-wrap:wrap;
  }
  .request-row b{ font-weight:600; }
  .request-row .accept{ color:#2f5d50; cursor:pointer; }
  .request-row .decline{ color:#b3423a; cursor:pointer; }
  .request-row .accept:hover, .request-row .decline:hover{ text-decoration:underline; }

  .auth-row{ display:flex; flex-direction:column; gap:14px; max-width:320px; margin-top:20px; }
  .auth-row input[type=email], .auth-row input[type=password]{
    font:inherit; font-size:17px; padding:10px 2px;
    border:none; border-bottom:2px solid #c9c6bd; background:transparent; color:#181816; outline:none;
  }
  .auth-row input[type=email]:focus, .auth-row input[type=password]:focus{ border-bottom-color:#181816; }
  .auth-submit{
    font:inherit; font-size:16px; padding:10px 14px; align-self:flex-start;
    border:1px solid #181816; background:#181816; color:#fafaf8; cursor:pointer; border-radius:4px;
  }
  .auth-submit:hover{ opacity:.85; }
  .auth-switch{ font-size:13px; color:#83807a; cursor:pointer; user-select:none; }
  .auth-switch:hover{ color:#181816; text-decoration:underline; }
  .auth-error{ font-size:13px; color:#b3423a; }
  .auth-notice{ font-size:13px; color:#2f5d50; }
</style>
</head>
<body>
<div class="wrap">
  <div id="top"></div>
  <div id="list"></div>
  <div class="bottom-bar" id="bottom-bar"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";

  // Renseigne ces deux valeurs (Supabase → Project Settings → API) pour activer
  // la connexion et la synchro. Tant qu'elles sont vides, l'app reste 100% locale.
  var SUPABASE_URL = "https://api.jppcompta.fr";
  var SUPABASE_ANON_KEY = "sb_publishable_E0IT5d21ODLOM3b6gS4C7i_RQB7BdmR";

  var supabaseClient = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;
  var currentUser = null;
  var authMode = "login";   // "login" ou "signup"
  var authError = "";
  var authNotice = "";
  var authDraftEmail = "";
  var authDraftPassword = "";

  var TKEY = "organizator:v5";
  var CKEY = "organizator:contacts";
  var tasks = loadTasksLocal();
  var contacts = loadContactsLocal();
  var links = [];               // lignes contact_links (demandes envoyées/reçues)
  var view = "tasks";           // "auth", "tasks" ou "settings"
  var openId = null;            // id de tâche avec un panneau ouvert
  var openType = null;          // "menu" (nom/bloqué/deadline) ou "assign" (déléguer)
  var contactOpenId = null;     // id de contact en cours d'édition/ajout

  function loadTasksLocal(){
    try{
      var raw = localStorage.getItem(TKEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return [];
  }
  function loadContactsLocal(){
    try{ var raw = localStorage.getItem(CKEY); return raw ? JSON.parse(raw) : []; }
    catch(e){ return []; }
  }
  function saveTasksLocal(){ try{ localStorage.setItem(TKEY, JSON.stringify(tasks)); }catch(e){} }
  function saveContactsLocal(){ try{ localStorage.setItem(CKEY, JSON.stringify(contacts)); }catch(e){} }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function daysBetween(dateStr){
    var today = new Date(todayStr() + "T00:00:00");
    var d = new Date(dateStr + "T00:00:00");
    return Math.round((d - today) / 86400000);
  }
  function fmtDate(dateStr){
    var p = dateStr.split("-");
    return p[2] + "/" + p[1];
  }
  function isMine(t){ return !currentUser || t.ownerId === currentUser.id; }

  function render(){
    if(view === "auth") renderAuthView();
    else if(view === "settings") renderSettingsView();
    else renderTasksView();
  }

  // ---------- authentification ----------

  function saveTaskRemote(t){
    if(!supabaseClient || !currentUser) return;
    supabaseClient.from("tasks").upsert({
      id: t.id,
      owner_id: t.ownerId,
      owner_email: t.ownerEmail,
      assignee_id: t.assigneeId || null,
      assignee_email: t.assigneeEmail || null,
      text: t.text,
      blocked: !!t.blocked,
      deadline: t.deadline || null,
      archived: !!t.archived,
      position: t.position || 0
    }).then(function(res){
      if(res.error) console.error("Supabase upsert tasks:", res.error.message);
    }).catch(function(err){ console.error("Supabase upsert tasks (réseau):", err.message); });
  }

  function deleteTaskRemote(id){
    if(!supabaseClient || !currentUser) return;
    supabaseClient.from("tasks").delete().eq("id", id)
      .then(function(res){ if(res.error) console.error("Supabase delete task:", res.error.message); })
      .catch(function(err){ console.error("Supabase delete task (réseau):", err.message); });
  }

  function fetchRemoteTasks(){
    return supabaseClient.from("tasks").select("*")
      .or("owner_id.eq." + currentUser.id + ",assignee_id.eq." + currentUser.id)
      .eq("archived", false)
      .order("position");
  }

  function mapRemoteTask(row){
    return {
      id: row.id, text: row.text, blocked: !!row.blocked, deadline: row.deadline || "",
      archived: !!row.archived, position: row.position || 0,
      ownerId: row.owner_id, ownerEmail: row.owner_email,
      assigneeId: row.assignee_id, assigneeEmail: row.assignee_email
    };
  }

  function fetchLinks(){
    return supabaseClient.from("contact_links").select("*")
      .or("requester_id.eq." + currentUser.id + ",target_id.eq." + currentUser.id);
  }

  function refreshLinks(cb){
    if(!supabaseClient || !currentUser){ if(cb) cb(); return; }
    fetchLinks().then(function(res){
      if(!res.error) links = res.data || [];
      if(cb) cb();
    }).catch(function(){ if(cb) cb(); });
  }

  function sendLinkRequest(email){
    if(!supabaseClient || !currentUser || !email) return;
    if(email === currentUser.email) return;
    var already = links.some(function(l){
      return (l.requester_email === currentUser.email && l.target_email === email)
          || (l.target_email === currentUser.email && l.requester_email === email);
    });
    if(already) return;
    supabaseClient.rpc("find_user_id_by_email", { lookup_email: email }).then(function(res){
      if(res.error || !res.data) return; // pas de compte avec cet email : rien à lier
      supabaseClient.from("contact_links").insert({
        requester_id: currentUser.id,
        target_id: res.data,
        requester_email: currentUser.email,
        target_email: email
      }).then(function(r){
        if(!r.error) refreshLinks(render);
      }).catch(function(){});
    }).catch(function(){});
  }

  function respondLink(link, accept){
    if(!supabaseClient) return;
    supabaseClient.from("contact_links").update({
      status: accept ? "accepted" : "declined",
      responded_at: new Date().toISOString()
    }).eq("id", link.id).then(function(res){
      if(!res.error) refreshLinks(render);
    }).catch(function(){});
  }

  function linkStatusFor(email){
    var l = links.find(function(x){
      return (x.requester_email === currentUser.email && x.target_email === email)
          || (x.target_email === currentUser.email && x.requester_email === email);
    });
    return l ? l.status : null;
  }

  function loadRemoteThenRender(){
    refreshLinks(function(){
      fetchRemoteTasks().then(function(res){
        if(res.error){ console.error("Supabase select tasks:", res.error.message); view = "tasks"; render(); return; }
        if(res.data && res.data.length){
          tasks = res.data.map(mapRemoteTask);
          saveTasksLocal();
        } else if(tasks.length){
          // premier login avec des tâches locales : on les pousse comme point de départ
          tasks.forEach(function(t){
            t.ownerId = currentUser.id; t.ownerEmail = currentUser.email;
            if(!t.id) t.id = uid();
            saveTaskRemote(t);
          });
        }
        view = "tasks";
        render();
      }).catch(function(err){
        console.error("Supabase select tasks (réseau):", err.message);
        view = "tasks"; render();
      });
    });
  }

  function renderAuthView(){
    document.getElementById("top").innerHTML = "";
    document.getElementById("bottom-bar").innerHTML = "";
    var listEl = document.getElementById("list");
    listEl.innerHTML = "";

    var title = document.createElement("div");
    title.className = "hint";
    title.style.color = "#181816"; title.style.fontSize = "17px"; title.style.padding = "15px 2px 0";
    title.textContent = authMode === "signup" ? "Créer un compte" : "Se connecter";
    listEl.appendChild(title);

    var wrap = document.createElement("div");
    wrap.className = "auth-row";

    var email = document.createElement("input");
    email.type = "email"; email.placeholder = "email"; email.autocomplete = "email";
    email.value = authDraftEmail;
    email.addEventListener("input", function(){ authDraftEmail = email.value; });

    var pass = document.createElement("input");
    pass.type = "password"; pass.placeholder = "mot de passe";
    pass.autocomplete = authMode === "signup" ? "new-password" : "current-password";
    pass.value = authDraftPassword;
    pass.addEventListener("input", function(){ authDraftPassword = pass.value; });

    var errorEl = document.createElement("div");
    errorEl.className = "auth-error";
    if(authError) errorEl.textContent = authError;

    var noticeEl = document.createElement("div");
    noticeEl.className = "auth-notice";
    if(authNotice) noticeEl.textContent = authNotice;

    var submit = document.createElement("button");
    submit.type = "button";
    submit.className = "auth-submit";
    submit.textContent = authMode === "signup" ? "Créer le compte" : "Se connecter";

    var switchLink = document.createElement("span");
    switchLink.className = "auth-switch";
    switchLink.textContent = authMode === "signup" ? "déjà un compte ? se connecter" : "pas de compte ? en créer un";
    switchLink.addEventListener("click", function(){
      authMode = authMode === "signup" ? "login" : "signup";
      authError = ""; authNotice = "";
      render();
    });

    function submitForm(){
      authError = ""; authNotice = "";
      var e = email.value.trim(), p = pass.value;
      if(!e || !p){ authError = "Email et mot de passe obligatoires."; render(); return; }
      submit.disabled = true;
      var call = authMode === "signup"
        ? supabaseClient.auth.signUp({ email: e, password: p })
        : supabaseClient.auth.signInWithPassword({ email: e, password: p });
      call.then(function(res){
        submit.disabled = false;
        if(res.error){ authError = res.error.message; render(); return; }
        if(authMode === "signup" && !res.data.session){
          authNotice = "Compte créé — vérifie ton email pour confirmer avant de te connecter.";
          authMode = "login";
          authDraftPassword = "";
          render();
          return;
        }
        currentUser = res.data.session.user;
        authDraftEmail = ""; authDraftPassword = "";
        view = "tasks";
        loadRemoteThenRender();
      }).catch(function(err){
        submit.disabled = false;
        authError = "Erreur réseau : " + err.message;
        render();
      });
    }
    submit.addEventListener("click", submitForm);
    pass.addEventListener("keydown", function(e){ if(e.key === "Enter") submitForm(); });

    wrap.appendChild(email);
    wrap.appendChild(pass);
    if(authError) wrap.appendChild(errorEl);
    if(authNotice) wrap.appendChild(noticeEl);
    wrap.appendChild(submit);
    wrap.appendChild(switchLink);
    listEl.appendChild(wrap);
  }

  function logout(){
    supabaseClient.auth.signOut().then(function(){
      currentUser = null; links = [];
      view = "auth"; authMode = "login";
      render();
    }).catch(function(){
      currentUser = null; links = [];
      view = "auth"; authMode = "login";
      render();
    });
  }

  function boot(){
    if(!supabaseClient){ render(); return; }
    supabaseClient.auth.getSession().then(function(res){
      var session = res.data.session;
      if(session){
        currentUser = session.user;
        loadRemoteThenRender();
      } else {
        view = "auth";
        render();
      }
    }).catch(function(err){
      console.error("Supabase getSession (réseau):", err.message);
      view = "auth";
      render();
    });
  }

  // ---------- vue tâches ----------

  function renderTasksView(){
    var top = document.getElementById("top");
    top.innerHTML = "";
    var pullIndicator = document.createElement("div");
    pullIndicator.className = "hint"; pullIndicator.id = "pull-indicator";
    pullIndicator.style.padding = "0 2px 6px"; pullIndicator.style.minHeight = "16px";
    top.appendChild(pullIndicator);

    var visible = tasks.filter(function(t){ return !t.archived; });

    var listEl = document.getElementById("list");
    listEl.innerHTML = "";
    visible.forEach(function(t){
      listEl.appendChild(renderLine(t));
      if(openId === t.id && openType === "menu") listEl.appendChild(renderMenu(t));
      if(openId === t.id && openType === "assign") listEl.appendChild(renderAssign(t));
    });

    var bar = document.getElementById("bottom-bar");
    bar.innerHTML = "";
    var add = document.createElement("span");
    add.className = "icon-btn"; add.id = "btn-add"; add.textContent = "+";
    add.addEventListener("click", addTask);
    bar.appendChild(add);
    var settings = document.createElement("span");
    settings.className = "icon-btn"; settings.textContent = "⚙";
    settings.title = "réglages";
    settings.addEventListener("click", function(){
      view = "settings";
      if(supabaseClient && currentUser) refreshLinks(render);
      else render();
    });
    bar.appendChild(settings);
  }

  function addTask(){
    // une tâche vide ne doit jamais s'accumuler si on clique plusieurs fois
    var empties = tasks.filter(function(x){ return x.text.trim() === "" && isMine(x); });
    tasks = tasks.filter(function(x){ return x.text.trim() !== "" || !isMine(x); });
    empties.forEach(function(x){ deleteTaskRemote(x.id); });
    var t = {
      id: uid(), text: "", blocked:false, deadline:"", archived:false, position: tasks.length,
      ownerId: currentUser ? currentUser.id : null, ownerEmail: currentUser ? currentUser.email : null,
      assigneeId: null, assigneeEmail: null
    };
    tasks.push(t);
    openId = t.id; openType = "menu";
    saveTasksLocal();
    render();
  }

  function contactNameByEmail(email){
    var c = contacts.find(function(x){ return x.email === email; });
    return c ? c.name : email;
  }

  function renderLine(t){
    var mine = isMine(t);
    var wrap = document.createElement("div");
    wrap.className = "line-wrap";

    var trashBg = document.createElement("div");
    trashBg.className = "trash-bg";
    trashBg.innerHTML = '<span class="icon">🗑</span><span class="word">POUBELLE</span>';
    wrap.appendChild(trashBg);

    var row = document.createElement("div");
    row.className = "line" + (t.blocked ? " blocked" : "") + (mine ? "" : " received");
    row.dataset.id = t.id;

    var text = document.createElement("span");
    text.className = "line-text";
    text.textContent = t.text;
    row.appendChild(text);

    if(mine && t.assigneeEmail){
      var a = document.createElement("span");
      a.className = "line-assignee";
      a.textContent = "→ " + contactNameByEmail(t.assigneeEmail);
      row.appendChild(a);
    }
    if(!mine){
      var f = document.createElement("span");
      f.className = "line-from";
      f.textContent = "← " + t.ownerEmail;
      row.appendChild(f);
    }

    if(t.deadline){
      var d = document.createElement("span");
      d.className = "line-date" + (daysBetween(t.deadline) < 0 ? " retard" : "");
      d.textContent = fmtDate(t.deadline);
      row.appendChild(d);
    }

    attachGestures(row, t, trashBg);
    wrap.appendChild(row);
    return wrap;
  }

  function renderMenu(t){
    var mine = isMine(t);
    var panel = document.createElement("div");
    panel.className = "panel";

    if(mine){
      var nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.value = t.text;
      function commitName(){
        var v = nameInput.value.trim();
        if(!v){
          if(t.assigneeId){
            // verrouillé : une tâche déléguée ne peut pas être supprimée de ce côté
            nameInput.value = t.text;
            return;
          }
          tasks = tasks.filter(function(x){ return x.id !== t.id; });
          deleteTaskRemote(t.id);
          openId = null;
          saveTasksLocal(); render();
          return;
        }
        if(v === t.text) return; // rien n'a changé : pas de re-rendu, ça casserait un clic en cours sur un autre contrôle du panneau
        t.text = v;
        saveTasksLocal(); saveTaskRemote(t); render();
      }
      nameInput.addEventListener("keydown", function(e){
        if(e.key === "Enter") commitName();
      });
      nameInput.addEventListener("blur", commitName);
      panel.appendChild(nameInput);
    } else {
      var staticName = document.createElement("span");
      staticName.className = "static";
      staticName.textContent = t.text;
      panel.appendChild(staticName);
    }

    var toggle = document.createElement("span");
    toggle.className = "toggle" + (t.blocked ? " on" : "");
    toggle.textContent = "bloqué";
    toggle.addEventListener("click", function(){ t.blocked = !t.blocked; saveTasksLocal(); saveTaskRemote(t); render(); });
    panel.appendChild(toggle);

    if(mine){
      var dateInput = document.createElement("input");
      dateInput.type = "date";
      dateInput.value = t.deadline || "";
      dateInput.addEventListener("change", function(e){ t.deadline = e.target.value; saveTasksLocal(); saveTaskRemote(t); render(); });
      panel.appendChild(dateInput);
    } else if(t.deadline){
      var staticDate = document.createElement("span");
      staticDate.className = "static";
      staticDate.textContent = fmtDate(t.deadline);
      panel.appendChild(staticDate);
    }

    return panel;
  }

  function renderAssign(t){
    var panel = document.createElement("div");
    panel.className = "panel";

    if(contacts.length){
      contacts.forEach(function(c, i){
        if(i > 0){
          var sep = document.createElement("span");
          sep.className = "sep"; sep.textContent = "·";
          panel.appendChild(sep);
        }
        var chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = c.name + (linkStatusFor(c.email) === "accepted" ? "" : " (local)");
        chip.addEventListener("click", function(){
          if(linkStatusFor(c.email) === "accepted"){
            var link = links.find(function(l){
              return (l.requester_email === currentUser.email && l.target_email === c.email)
                  || (l.target_email === currentUser.email && l.requester_email === c.email);
            });
            t.assigneeId = link.requester_email === currentUser.email ? link.target_id : link.requester_id;
            t.assigneeEmail = c.email;
          } else {
            t.assigneeEmail = c.email || c.name;
          }
          openId = null;
          saveTasksLocal(); saveTaskRemote(t); render();
        });
        panel.appendChild(chip);
      });
    }

    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = contacts.length ? "ou un autre nom…" : "assigné à… (nom libre)";
    input.value = t.assigneeEmail && !contacts.some(function(c){ return c.email === t.assigneeEmail; }) ? t.assigneeEmail : "";
    function commit(){
      var v = input.value.trim();
      if(v){ t.assigneeEmail = v; t.assigneeId = null; }
      openId = null;
      saveTasksLocal(); saveTaskRemote(t); render();
    }
    input.addEventListener("keydown", function(e){ if(e.key === "Enter") commit(); });
    input.addEventListener("blur", commit);
    panel.appendChild(input);

    return panel;
  }

  function attachGestures(el, t, trashBg){
    var mine = isMine(t);
    var locked = mine && !!t.assigneeId; // tâche déléguée : pas de suppression/archivage de ce côté
    var startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, moved = false, dir = null;
    var H_THRESHOLD = 70, DELETE_THRESHOLD = 130, LOCK = 8;

    el.addEventListener("pointerdown", function(e){
      startX = e.clientX; startY = e.clientY; dx = 0; dy = 0;
      dragging = true; moved = false; dir = null;
      el.setPointerCapture(e.pointerId);
      el.style.transition = "none";
    });
    el.addEventListener("pointermove", function(e){
      if(!dragging) return;
      dx = e.clientX - startX; dy = e.clientY - startY;
      if(!dir && (Math.abs(dx) > LOCK || Math.abs(dy) > LOCK)){
        dir = Math.abs(dy) > Math.abs(dx) ? "v" : "h";
        if(dir === "h" && !mine && dx > 0) dir = null; // pas d'assignation sur une tâche reçue
        moved = !!dir;
        if(dir === "v"){ el.style.zIndex = "5"; el.style.boxShadow = "0 4px 10px rgba(0,0,0,.15)"; el.style.background = "#fafaf8"; }
      }
      if(dir === "h") el.style.transform = "translateX(" + dx + "px)";
      else if(dir === "v") el.style.transform = "translateY(" + dy + "px)";
      if(dir === "h" && dx < 0 && !locked){
        trashBg.classList.toggle("armed", dx <= -DELETE_THRESHOLD);
      } else {
        trashBg.classList.remove("armed");
      }
    });
    function end(e){
      if(!dragging) return;
      dragging = false;
      el.style.transition = "transform .15s ease";
      el.style.transform = "";
      el.style.zIndex = ""; el.style.boxShadow = ""; el.style.background = "";
      trashBg.classList.remove("armed");

      if(!moved){
        openId = t.id; openType = "menu";
        render();
        return;
      }
      if(dir === "h" && dx <= -DELETE_THRESHOLD){
        if(!locked) archiveTask(t);
      } else if(dir === "h" && dx >= H_THRESHOLD && mine){
        openId = t.id; openType = "assign";
        render();
      } else if(dir === "v" && mine){
        reorder(t, e.clientY);
      }
    }
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  }

  function reorder(t, clientY){
    var rows = Array.prototype.slice.call(document.querySelectorAll(".line"));
    var newIndex = 0;
    rows.forEach(function(r){
      if(r.dataset.id === t.id) return;
      var rect = r.getBoundingClientRect();
      var mid = rect.top + rect.height / 2;
      if(clientY > mid) newIndex++;
    });
    var fromIndex = tasks.findIndex(function(x){ return x.id === t.id; });
    if(fromIndex === -1) return;
    tasks.splice(fromIndex, 1);
    tasks.splice(newIndex, 0, t);
    tasks.forEach(function(x, i){
      if(x.position !== i){ x.position = i; if(isMine(x)) saveTaskRemote(x); }
    });
    saveTasksLocal();
    render();
  }

  function sortByDeadline(){
    var open = tasks.filter(function(t){ return !t.archived; });
    var archivedOnes = tasks.filter(function(t){ return t.archived; });
    open.sort(function(a, b){
      if(!a.deadline && !b.deadline) return 0;
      if(!a.deadline) return 1;
      if(!b.deadline) return -1;
      return a.deadline < b.deadline ? -1 : a.deadline > b.deadline ? 1 : 0;
    });
    tasks = open.concat(archivedOnes);
    tasks.forEach(function(x, i){
      if(x.position !== i){ x.position = i; if(isMine(x)) saveTaskRemote(x); }
    });
    saveTasksLocal();
    render();
  }

  // Tirer la page vers le bas (depuis le fond, pas depuis une ligne) trie par échéance.
  (function attachPullToSort(){
    var startY = 0, dragging = false, armed = false;
    var PULL_THRESHOLD = 70;

    function isBackgroundTarget(el){
      return !el.closest(".line, .panel, .icon-btn, .back, .auth-switch, .link, .request-row, input, button");
    }

    document.addEventListener("pointerdown", function(e){
      if(view !== "tasks") return;
      if(window.scrollY > 0) return;
      if(!isBackgroundTarget(e.target)) return;
      startY = e.clientY; dragging = true; armed = false;
    });
    document.addEventListener("pointermove", function(e){
      if(!dragging) return;
      var dy = e.clientY - startY;
      if(dy <= 0){ armed = false; updatePullIndicator(false, false); return; }
      armed = dy >= PULL_THRESHOLD;
      updatePullIndicator(true, armed);
    });
    function finish(){
      if(!dragging) return;
      dragging = false;
      if(armed) sortByDeadline();
      updatePullIndicator(false, false);
    }
    document.addEventListener("pointerup", finish);
    document.addEventListener("pointercancel", finish);

    function updatePullIndicator(active, isArmed){
      var el = document.getElementById("pull-indicator");
      if(!el) return;
      if(!active){ el.textContent = ""; return; }
      el.textContent = isArmed ? "↓ relâche pour trier par échéance" : "↓ tire encore un peu…";
    }
  })();

  function archiveTask(t){
    t.archived = true;
    if(openId === t.id){ openId = null; openType = null; }
    saveTasksLocal();
    saveTaskRemote(t);
    render();
  }

  // ---------- vue réglages (contacts) ----------

  function renderSettingsView(){
    var top = document.getElementById("top");
    top.innerHTML = "";
    var back = document.createElement("span");
    back.className = "back";
    back.textContent = "← retour";
    back.addEventListener("click", function(){ view = "tasks"; render(); });
    top.appendChild(back);

    var listEl = document.getElementById("list");
    listEl.innerHTML = "";

    var pendingIn = links.filter(function(l){ return l.status === "pending" && l.target_email === currentUser.email; });
    pendingIn.forEach(function(l){
      listEl.appendChild(renderRequestRow(l));
    });

    if(!contacts.length && contactOpenId === null){
      var hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = "aucun contact — ajoute-en un pour créer des raccourcis d'assignation.";
      listEl.appendChild(hint);
    }
    contacts.forEach(function(c){
      listEl.appendChild(renderContactLine(c));
      if(contactOpenId === c.id) listEl.appendChild(renderContactForm(c));
    });
    if(contactOpenId && !contacts.some(function(c){ return c.id === contactOpenId; })){
      // contact en cours de création (pas encore dans la liste)
      var draft = { id: contactOpenId, name:"", email:"", phone:"" };
      listEl.appendChild(renderContactForm(draft, true));
    }

    var bar = document.getElementById("bottom-bar");
    bar.innerHTML = "";
    var add = document.createElement("span");
    add.className = "icon-btn"; add.textContent = "+";
    add.addEventListener("click", addContact);
    bar.appendChild(add);

    if(supabaseClient && currentUser){
      var out = document.createElement("span");
      out.className = "auth-switch";
      out.style.marginLeft = "auto";
      out.textContent = "se déconnecter (" + currentUser.email + ")";
      out.addEventListener("click", logout);
      bar.appendChild(out);
    }
  }

  function renderRequestRow(l){
    var row = document.createElement("div");
    row.className = "request-row";
    var txt = document.createElement("span");
    txt.innerHTML = "<b>" + escapeHtml(l.requester_email) + "</b> veut se lier";
    row.appendChild(txt);
    var accept = document.createElement("span");
    accept.className = "accept"; accept.textContent = "accepter";
    accept.addEventListener("click", function(){ respondLink(l, true); });
    row.appendChild(accept);
    var decline = document.createElement("span");
    decline.className = "decline"; decline.textContent = "refuser";
    decline.addEventListener("click", function(){ respondLink(l, false); });
    row.appendChild(decline);
    return row;
  }

  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function addContact(){
    contacts = contacts.filter(function(c){ return c.name.trim() !== ""; });
    saveContactsLocal();
    contactOpenId = uid();
    render();
  }

  function renderContactLine(c){
    var row = document.createElement("div");
    row.className = "line";
    row.style.cursor = "pointer";

    var text = document.createElement("span");
    text.className = "line-text";
    text.textContent = c.name;
    row.appendChild(text);

    if(c.email || c.phone){
      var sub = document.createElement("span");
      sub.className = "line-sub";
      sub.textContent = [c.email, c.phone].filter(Boolean).join(" · ");
      row.appendChild(sub);
    }

    if(supabaseClient && currentUser && c.email){
      var st = linkStatusFor(c.email);
      if(st){
        var badge = document.createElement("span");
        badge.className = "contact-status" + (st === "accepted" ? " accepted" : st === "pending" ? " pending" : "");
        badge.textContent = st === "accepted" ? "lié" : st === "pending" ? "en attente" : st;
        row.appendChild(badge);
      }
    }

    row.addEventListener("click", function(){
      contactOpenId = contactOpenId === c.id ? null : c.id;
      render();
    });
    return row;
  }

  function renderContactForm(c, isNew){
    var panel = document.createElement("div");
    panel.className = "panel";

    var nameInput = document.createElement("input");
    nameInput.type = "text"; nameInput.placeholder = "nom";
    nameInput.value = c.name;

    var emailInput = document.createElement("input");
    emailInput.type = "text"; emailInput.placeholder = "email (facultatif)";
    emailInput.value = c.email || "";

    var phoneInput = document.createElement("input");
    phoneInput.type = "text"; phoneInput.placeholder = "téléphone (facultatif)";
    phoneInput.value = c.phone || "";

    function commit(){
      var name = nameInput.value.trim();
      var email = emailInput.value.trim();
      var phone = phoneInput.value.trim();
      if(!name){
        contacts = contacts.filter(function(x){ return x.id !== c.id; });
        contactOpenId = null;
        saveContactsLocal(); render();
        return;
      }
      var existing = contacts.find(function(x){ return x.id === c.id; });
      var emailChanged = !existing || existing.email !== email;
      if(existing){
        if(existing.name === name && existing.email === email && existing.phone === phone) return;
        existing.name = name; existing.email = email; existing.phone = phone;
      } else {
        contacts.push({ id: c.id, name: name, email: email, phone: phone });
      }
      saveContactsLocal(); render();
      if(email && emailChanged) sendLinkRequest(email);
    }
    [nameInput, emailInput, phoneInput].forEach(function(inp){
      inp.addEventListener("keydown", function(e){ if(e.key === "Enter") commit(); });
    });
    // ne valider que quand le focus quitte le panneau entier (pas en passant d'un champ à l'autre)
    panel.addEventListener("focusout", function(e){
      if(panel.contains(e.relatedTarget)) return;
      commit();
    });

    panel.appendChild(nameInput);
    panel.appendChild(emailInput);
    panel.appendChild(phoneInput);

    if(!isNew){
      var del = document.createElement("span");
      del.className = "link"; del.textContent = "supprimer";
      del.addEventListener("click", function(){
        contacts = contacts.filter(function(x){ return x.id !== c.id; });
        contactOpenId = null;
        saveContactsLocal(); render();
      });
      panel.appendChild(del);
    }

    setTimeout(function(){ nameInput.focus(); }, 0);
    return panel;
  }

  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(view === "settings" && contactOpenId){ contactOpenId = null; render(); return; }
    if(view === "tasks" && openId){ openId = null; openType = null; render(); }
  });

  boot();
})();
</script>
</body>
</html>
